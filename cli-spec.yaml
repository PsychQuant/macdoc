    abstract: "BibLaTeX (.bib) → APA 7 格式轉換（支援 --key filtering，無 --key 時可用 convert）"
    subcommands: [to-html, to-json, to-md, list]
    project:
      status: active
      notes:
        - "`macdoc convert --to html|md|json file.bib` converts a whole file; these subcommands add repeatable --key filtering and `list`."
  - path: "macdoc bib to-html"
    abstract: "將 .bib 轉換為 APA 7 HTML 參考文獻列表"
    arguments:
      - name: input
        required: true
        help: "輸入 .bib 檔案路徑"
    options:
      - names: ["--output", "-o"]
        value_name: output
        required: false
        help: "輸出 .html 檔案路徑（預設為 stdout）"
      - names: ["--css"]
        value_name: css
        required: false
        default: web
        values: [minimal, web, dark, light]
        help: "CSS 風格：minimal（學術）或 web（現代）"
      - names: ["--key"]
        value_name: key
        required: false
        repeating: true
        help: "只輸出指定 entry key（可多次使用）"
    flags:
      - names: ["--full"]
        required: false
        help: "輸出完整 HTML 文件（含 <html>, <head>, CSS）"
  - path: "macdoc bib to-json"
    abstract: "將 .bib 轉換為 APA 7 JSON（含 pre-rendered HTML）"
    arguments:
      - name: input
        required: true
        help: "輸入 .bib 檔案路徑"
    options:
      - names: ["--output", "-o"]
        value_name: output
        required: false
        help: "輸出 .json 檔案路徑（預設為 stdout）"
      - names: ["--key"]
        value_name: key
        required: false
        repeating: true
        help: "只輸出指定 entry key（可多次使用）"
    flags:
      - names: ["--compact"]
        required: false
        help: "壓縮輸出（不換行）"
  - path: "macdoc bib to-md"
    abstract: "將 .bib 轉換為 APA 7 Markdown 參考文獻列表"
    arguments:
      - name: input
        required: true
        help: "輸入 .bib 檔案路徑"
    options:
      - names: ["--output", "-o"]
        value_name: output
        required: false
        help: "輸出 .md 檔案路徑（預設為 stdout）"
      - names: ["--key"]
        value_name: key
        required: false
        repeating: true
        help: "只輸出指定 entry key（可多次使用）"
    flags:
      - names: ["--heading"]
        required: false
        help: "加入 '## References' 標題"
  - path: "macdoc bib list"
    abstract: "列出 .bib 檔案中的所有 entry keys"
    arguments:
      - name: input
        required: true
        help: "輸入 .bib 檔案路徑"
    flags:
      - names: ["--show-type"]
        required: false
        help: "顯示 entry type"
  - path: "macdoc config"
    abstract: "macdoc 設定管理"
    subcommands: [ai, ocr, document]
  - path: "macdoc config ai"
    abstract: "AI CLI 工具設定"
    subcommands: [detect, list, set]
  - path: "macdoc config ai detect"
    abstract: "自動偵測已安裝的 AI CLI 工具，寫入設定檔。"
  - path: "macdoc config ai list"
    abstract: "顯示目前的 AI 設定。"
  - path: "macdoc config ai set"
    abstract: "設定 AI 參數（如 transcription、agent）。"
    arguments:
      - name: key
        required: true
        help: "設定鍵（transcription 或 agent）。"
      - name: value
        required: true
        help: "設定值（codex、claude 或 gemini）。"
  - path: "macdoc config ocr"
    abstract: "OCR Ollama host 與模型設定"
    subcommands: [list, add-host, remove-host, set-default, set-model, set-backend]
    project:
      status: active
      notes:
        - "Stores Ollama host profiles, the OCR model and the OCR backend in the macdoc config file."
        - "#218: `macdoc pdf ocr`, when run with --mode ollama, reads the host profiles and the OCR model as fallbacks for its own --host/--model when those flags are omitted (priority: explicit flag > this setting > pdf ocr's built-in default). Under --mode local these settings are never read at all. The OCR backend setting is stored but still not read by any command — see `macdoc config ocr set-backend`'s own abstract for why."
  - path: "macdoc config ocr list"
    abstract: "顯示目前的 OCR 設定。"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config ocr add-host"
    abstract: "新增或更新具名 host profile（如 kyle → localhost:11435）。"
    arguments:
      - name: name
        required: true
        help: "Profile 名稱（如 kyle、local、production）。"
      - name: address
        required: true
        help: "Ollama 伺服器地址（如 localhost:11435 或 192.168.1.100:11434）。"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config ocr remove-host"
    abstract: "移除具名 host profile。"
    arguments:
      - name: name
        required: true
        help: "要移除的 profile 名稱。"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config ocr set-default"
    abstract: "設定預設 host profile（之後 pdf ocr 不傳 --host 就用這個，見 #218）。"
    arguments:
      - name: name
        required: true
        help: "已存在的 profile 名稱。傳空字串清除。"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config ocr set-model"
    abstract: "設定預設 OCR 模型名稱（--mode ollama 時 pdf ocr 的 --model 預設值，見 #218）。"
    arguments:
      - name: model
        required: true
        help: "模型名稱（如 glm-ocr）。"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config ocr set-backend"
    abstract: "設定預設 OCR 後端（ollama 或 mlx）。目前 pdf ocr 的 --mode 不會讀這個設定：--mode 本身仍照舊維持自己的內建預設 local，只有想用 Ollama 時才需要自己傳 --mode ollama（見 #218）。"
    arguments:
      - name: backend
        required: true
        help: "後端名稱（ollama 或 mlx）。"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config document"
    abstract: "文件格式設定與範本快照"
    subcommands: [show, set-default, import-official, gc]
  - path: "macdoc config document show"
    abstract: "顯示文件格式設定"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "文件設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config document set-default"
    abstract: "設定新文件的預設格式"
    arguments:
      - name: profile
        required: true
        values: [inherit, official]
        help: "inherit 或 official"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "文件設定檔路徑（預設 ~/.config/macdoc/config.json）"
  - path: "macdoc config document import-official"
    abstract: "從 Normal 範本匯入安全格式快照；不變更新文件預設值"
    options:
      - names: ["--template"]
        value_name: template
        required: false
        help: "範本路徑（省略時使用目前帳號的 Word Normal.dotm）"
      - names: ["--config"]
        value_name: config
        required: false
        help: "文件設定檔路徑（預設 ~/.config/macdoc/config.json）"
    project:
      status: active
      dependencies: [microsoft-word]
      notes:
        - "Without --template it reads Normal.dotm from Microsoft Word's Office group container for the current account."
  - path: "macdoc config document gc"
    abstract: "清理未被引用的 official 格式快照；預設只列出，加 --force 才刪除"
    options:
      - names: ["--config"]
        value_name: config
        required: false
        help: "文件設定檔路徑（預設 ~/.config/macdoc/config.json）"
    flags:
      - names: ["--force"]
        required: false
        help: "實際刪除列出的快照（預設只預覽）"
  - path: "macdoc ocr"
    abstract: "（已移除）文字辨識改用 bestocr — PsychQuant/bestOCR"
    arguments:
      - name: ignored
        required: false
        repeating: true
        parsing: all_unrecognized
        hidden: true
    project:
      status: removed
      replacement: "bestocr (https://github.com/PsychQuant/bestOCR)"
      notes:
        - "Deprecation shim (#145): accepts and ignores any arguments, prints migration guidance to stderr and exits with status 2."
        - "General-purpose OCR belongs to bestOCR; page-level OCR inside the PDF → LaTeX pipeline is `macdoc pdf ocr`."
  - path: "macdoc docx"
    abstract: "Manifest-driven .docx edit workflows."
    subcommands: [apply, plan, verify, diff]
  - path: "macdoc docx apply"
    abstract: "Apply a manifest to a baseline .docx and write the result."
    arguments:
      - name: manifest-path
        required: true
        help: "Path to the manifest JSON file."
    options:
      - names: ["--input", "-i"]
        value_name: input
        required: true
        help: "Baseline .docx input path."
      - names: ["--output", "-o"]
        value_name: output
        required: true
        help: "Output .docx path."
  - path: "macdoc docx plan"
    abstract: "Resolve anchors and print the planned Edit sequence without writing output."
    arguments:
      - name: manifest-path
        required: true
        help: "Path to the manifest JSON file."
    options:
      - names: ["--input", "-i"]
        value_name: input
        required: true
        help: "Baseline .docx input path."
  - path: "macdoc docx verify"
    abstract: "Run the verify chain only, against an existing baseline + output pair."
    options:
      - names: ["--manifest"]
        value_name: manifest
        required: true
        help: "Path to the manifest JSON file (carrying the verify block)."
      - names: ["--input", "-i"]
        value_name: input
        required: true
        help: "Baseline .docx path."
      - names: ["--output", "-o"]
        value_name: output
        required: true
        help: "Output .docx path (the document to verify against the baseline)."
  - path: "macdoc docx diff"
    abstract: "Print structural differences between two .docx documents (Phase 1: paragraph-level)."
    arguments:
      - name: a
        required: true
        help: "First .docx path."
      - name: b
        required: true
        help: "Second .docx path."
  - path: "macdoc word"
    abstract: "Word 文件工具（.mdocx 腳本轉換）"
    subcommands: [reverse, render]
    project:
      status: active
      docs: ["docs/swift-as-document-source.md", "openspec/specs/mdocx-grammar/spec.md"]
  - path: "macdoc word reverse"
    abstract: "從 docx 反向生成 .mdocx.swift 腳本"
    arguments:
      - name: input
        required: true
        help: "輸入的 .docx 檔案"
    options:
      - names: ["--to-mdocx"]
        value_name: to-mdocx
        required: false
        help: "輸出的 .mdocx.swift 路徑（省略時須搭配 --coverage）"
      - names: ["--slot"]
        value_name: "name=paraId"
        required: false
        repeating: true
        help: "具名內容 slot：<name>=<paragraph-id>（可重複）。指定段落的文字成為腳本的 Swift 函式參數，其餘內容逐字重建"
    flags:
      - names: ["--from-oplog"]
        required: false
        help: "強制使用 oplog sidecar（優先 <docx-full-name>.oplog.jsonl；缺少時可讀 legacy <stem>.oplog.jsonl；兩者皆無則報錯）"
      - names: ["--force"]
        required: false
        help: "覆寫既有的輸出檔案"
      - names: ["--coverage"]
        required: false
        help: "印出 per-part DSL/raw 覆蓋率報告（dual-track coverage metric）"
      - names: ["--paragraphs-only"]
        required: false
        help: "只反向工程段落（舊行為）；預設為 full-fidelity 全 parts byte-equal 腳本"
  - path: "macdoc word render"
    abstract: "執行 .mdocx.swift 腳本重建 docx"
    arguments:
      - name: input
        required: true
        help: "輸入的 .mdocx.swift（或 .mdocx）腳本"
    options:
      - names: ["--to-docx"]
        value_name: to-docx
        required: true
        help: "輸出的 .docx 路徑"
      - names: ["--profile"]
        value_name: profile
        required: false
        values: [inherit, official]
        help: "明示套用 inherit 或 official；省略時不讀取新文件預設設定"
      - names: ["--document-config"]
        value_name: document-config
        required: false
        help: "文件設定檔路徑"
      - names: ["--verify-against"]
        value_name: verify-against
        required: false
        help: "參考 .docx；提供時對重建的 part set 做 byte-equal 驗證（含 binary part）"
    flags:
      - names: ["--force"]
        required: false
        help: "覆寫既有的輸出檔案"
conversions:
  - label: "Word → Markdown"
    command: "macdoc convert"
    from: [docx]
    to: md
    converter: word-to-md-swift
    output: stdout_or_file
    options: ["--frontmatter", "--hard-breaks"]
  - label: "Word → HTML"
    command: "macdoc convert"
    from: [docx]
    to: html
    converter: word-to-html-swift
    output: stdout_or_file
    options: ["--frontmatter"]
  - label: "Word → Marker"
    command: "macdoc convert"
    from: [docx]
    to: marker
    converter: marker-word-converter-swift
    output: directory
    options: ["--frontmatter", "--hard-breaks"]
    notes:
      - "Writes Markdown, _meta.json and images/ into --output, or <input-stem>_output/ beside the input; --stdout is rejected."
  - label: "HTML → Markdown"
    command: "macdoc convert"
    from: [html, htm]
    to: md
    converter: html-to-md-swift
    output: stdout_or_file
    options: ["--frontmatter", "--hard-breaks", "--html-extensions"]
  - label: "HTML → PDF"
    command: "macdoc convert"
    from: [html, htm]
    to: pdf
    converter: playwright
    output: file
    dependencies: [playwright]
    notes:
      - "Runs `playwright pdf` with A4 paper; without playwright on PATH it fails with an install hint."
  - label: "HTML → Word"
    command: "macdoc convert"
    from: [html, htm]
    to: docx
    converter: html-to-word-swift
    output: file
    options: ["--profile", "--document-config"]
  - label: "Markdown → HTML"
    command: "macdoc convert"
    from: [md, markdown]
    to: html
    converter: md-to-html-swift
    output: stdout_or_file
    options: ["--full"]
  - label: "Markdown → Word"
    command: "macdoc convert"
    from: [md, markdown]
    to: docx
    converter: md-to-word-swift
    output: file
    options: ["--hard-breaks", "--math", "--profile", "--document-config"]
    notes:
      - "--math omath turns $…$ formulas into native Word OMath; --math literal keeps them as text."
  - label: "SRT → HTML"
    command: "macdoc convert"
    from: [srt]
    to: html
    converter: srt-to-html-swift
    output: stdout_or_file
    options: ["--full", "--css"]
    styles: [dark, light]
    notes:
      - "This route accepts only --css dark or --css light. --css has no built-in default (#216); when it is omitted this route falls back to dark."
      - "Speaker labels (`Speaker 1:` or `[Speaker 1]`) become speaker badges."
  - label: "BibLaTeX → APA HTML"
    command: "macdoc convert"
    from: [bib]
    to: html
    converter: bib-apa-to-html-swift
    output: stdout_or_file
    options: ["--full", "--css"]
    styles: [minimal, web]
    notes:
      - "--css has no built-in default (#216); when it is omitted this route falls back to web."
  - label: "BibLaTeX → APA Markdown"
    command: "macdoc convert"
    from: [bib]
    to: md
    converter: bib-apa-to-md-swift
    output: stdout_or_file
  - label: "BibLaTeX → APA JSON"
    command: "macdoc convert"
    from: [bib]
    to: json
    converter: bib-apa-to-json-swift
    output: stdout_or_file
  - label: "PDF → Markdown"
    command: "macdoc convert"
    from: [pdf]
    to: md
    converter: pdf-to-md-swift
    output: stdout_or_file
    options: ["--frontmatter", "--hard-breaks"]
    notes:
      - "Reads the embedded text layer with PDFKit (no OCR)."
  - label: "PDF → DOCX"
    command: "macdoc convert"
    from: [pdf]
    to: docx
    converter: pdf-to-docx-swift
    output: file
    options: ["--hard-breaks", "--profile", "--document-config"]
    notes:
      - "Reads the embedded text layer with PDFKit (no OCR)."
  - label: "PDF → LaTeX"
    command: "macdoc pdf"
    from: [pdf]
    to: tex
    converter: pdf-to-latex-swift
    output: directory
    notes:
      - "Multi-step project pipeline, not a `convert` route: init → render → ocr → chapters → assemble, then normalize → fix-envs → compile-check → consolidate."
  - label: "LaTeX → Word"
    command: "macdoc convert"
    from: [tex]
    to: docx
    converter: tex-to-docx-swift
    output: file
    options: ["--profile", "--document-config"]
  - label: "舊版 Note → HTML"
    command: "macdoc convert"
    from: [note, ntb]
    to: html
    converter: note-to-html-swift
    output: directory_or_stdout
    options: ["--full", "--css"]
    styles: [dark, light]
    notes:
      - "Legacy plist-based .note only; modern FlatBuffers .ntb containers are recognized and rejected."
      - "Writes <input-stem>/ with index.html and media/ (or --output); --stdout prints one self-contained HTML, with --full for a complete document."
      - "This route accepts only --css dark or --css light. --css has no built-in default (#216); when it is omitted this route falls back to dark."
  - label: "舊版 Note → PDF"
    command: "macdoc convert"
    from: [note, ntb]
    to: pdf
    converter: note-to-pdf-swift
    output: file
    notes:
      - "Legacy plist-based .note only; modern FlatBuffers .ntb containers are recognized and rejected."
  - label: "UTF-8 text → Token count"
    command: "macdoc convert"
    from: ["*"]
    to: tokens
    converter: token-counter-swift
    output: stdout_or_file
    options: ["--model", "--allow-network"]
    dependencies: [anthropic-api]
    notes:
      - "Measurement route: any extension, strict UTF-8, at most 1,000,000 bytes."
      - "gpt-4o counts offline; claude-sonnet-4-6 sends the whole file to Anthropic and needs --allow-network and ANTHROPIC_API_KEY."
overlaps:
  - topic: "PDF text, OCR and LaTeX"
    paths:
      - command: "macdoc convert"
        usage: "macdoc convert --to md file.pdf"
        note: "Reads the PDF's embedded text layer with PDFKit plus heading/list heuristics; no OCR, so scanned pages yield no text. `--to docx` does the same into Word."
      - command: "macdoc pdf ocr"
        usage: "macdoc pdf ocr --project <dir>"
        note: "Page-image GLM-OCR (local MLX or Ollama) inside the PDF → LaTeX project pipeline; results feed `pdf chapters` and `pdf assemble`."
      - command: "macdoc ocr"
        usage: "macdoc ocr <input>"
        note: "Removed shim (#145): exits with status 2 and points to bestocr, which owns general-purpose OCR."
      - command: "macdoc config ocr"
        usage: "macdoc config ocr list"
        note: "Edits OCR host and model settings that feed `pdf ocr`'s --host/--model when those flags are omitted under --mode ollama (#218; --mode local never reads them); the backend setting is still not read by any command."
  - topic: "BibLaTeX to APA 7"
    paths:
      - command: "macdoc convert"
        usage: "macdoc convert --to html file.bib"
        note: "Whole file to APA 7 HTML, Markdown or JSON; HTML takes --full and --css minimal|web."
      - command: "macdoc bib to-html"
        usage: "macdoc bib to-html file.bib --key smith2020"
        note: "Same renderers with repeatable --key filtering and -o; `bib to-md` and `bib to-json` likewise, `bib list` prints entry keys."
  - topic: "Word documents and .mdocx scripts"
    paths:
      - command: "macdoc convert"
        usage: "macdoc convert --to md file.docx"
        note: "Readable Markdown export; lossy by design."
      - command: "macdoc word reverse"
        usage: "macdoc word reverse file.docx --to-mdocx out.mdocx.swift"
        note: "Full-fidelity .mdocx.swift script; `macdoc word render` rebuilds the .docx from it."
      - command: "macdoc docx apply"
        usage: "macdoc docx apply manifest.json -i base.docx -o out.docx"
        note: "Manifest-driven edits of an existing .docx."
external_dependencies:
  - id: playwright
    kind: cli
    purpose: "Renders HTML to PDF through Chromium (`playwright pdf`)."
    install: "pip install playwright && playwright install chromium"
    used_by: ["HTML → PDF"]
  - id: tex
    kind: cli
    purpose: "latexmk and pdflatex from a TeX distribution compile the assembled or accumulated LaTeX."
    install: "MacTeX or TeX Live"
    used_by: ["macdoc pdf assemble", "macdoc pdf compile-check", "macdoc pdf consolidate"]
  - id: ai-cli
    kind: cli
    purpose: "codex, claude or gemini CLI, delegated for block/page transcription and compile-error repair."
    install: "Install at least one; `macdoc config ai detect` records what is available."
    used_by: ["macdoc pdf transcribe", "macdoc pdf transcribe-pages", "macdoc pdf resume", "macdoc pdf consolidate"]
  - id: ollama
    kind: network_service
    purpose: "Serves the glm-ocr model over HTTP for `pdf ocr --mode ollama` at the address given by --host."
    install: "Install Ollama and pull the glm-ocr model."
    used_by: ["macdoc pdf ocr"]
  - id: huggingface
    kind: network_service
    purpose: "Hugging Face Hub, from which `pdf ocr --mode local` downloads the MLX model named by --model on first use."
    used_by: ["macdoc pdf ocr"]
  - id: anthropic-api
    kind: network_service
    purpose: "Anthropic token counting for `--to tokens --model claude-sonnet-4-6`; needs --allow-network and ANTHROPIC_API_KEY."
    used_by: ["UTF-8 text → Token count"]
  - id: microsoft-word
    kind: application
    purpose: "Provides the Normal.dotm template that `config document import-official` reads when --template is omitted."
    used_by: ["macdoc config document import-official"]
