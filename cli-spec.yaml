commands:
  - path: macdoc
    abstract: "原生 macOS 文件處理工具"
    subcommands: [convert, pdf, bib, config, ocr, docx, word]
  - path: "macdoc convert"
    abstract: "Convert documents between formats (textutil-compatible)"
    arguments:
      - name: input
        required: true
        help: "Input file"
    options:
      - names: ["--to"]
        value_name: to
        required: true
        help: "Target format (md, html, docx, pdf, json, marker, tokens)"
      - names: ["--profile"]
        value_name: profile
        required: false
        values: [inherit, official]
        help: "DOCX 文件格式：inherit 或 official；優先於新文件預設設定"
      - names: ["--document-config"]
        value_name: document-config
        required: false
        help: "文件設定檔路徑"
      - names: ["--model"]
        value_name: model
        required: false
        help: "Token model: gpt-4o or claude-sonnet-4-6"
      - names: ["--output"]
        value_name: output
        required: false
        help: "Output file path (or directory for marker)"
      - names: ["--css"]
        value_name: css
        required: false
        values: [minimal, web, dark, light]
        help: "CSS style: minimal|web (bib), dark|light (srt)"
      - names: ["--math"]
        value_name: math
        required: false
        values: [literal, omath]
        help: "Markdown math mode: literal|omath (Markdown to DOCX only; default: literal)"
    flags:
      - names: ["--allow-network"]
        required: false
        help: "Allow sending the complete input text to a network provider"
      - names: ["--stdout"]
        required: false
        help: "Force output to stdout"
      - names: ["--hard-breaks"]
        required: false
        help: "Treat soft breaks as hard line breaks"
      - names: ["--full"]
        required: false
        help: "Output full HTML document instead of fragment"
      - names: ["--frontmatter"]
        required: false
        help: "Include YAML frontmatter metadata"
      - names: ["--html-extensions"]
        required: false
        help: "Preserve <u>/<sup>/<sub>/<mark> as raw HTML in Markdown"
    project:
      status: active
      notes:
        - "The input format is detected from the file extension; `conversions` lists every route with its route-specific options."
        - "Output handling is per route: see `output` on each entry of `conversions`."
      docs: [".claude/rules/cli-design/convert-entry-point.md", CONVERSIONS.md]
  - path: "macdoc pdf"
    abstract: "PDF → LaTeX pipeline 工具"
    default_subcommand: status
    subcommands: [init, segment, render, ocr, blocks, transcribe, transcribe-pages, resume, chapters, assemble, normalize, fix-envs, compile-check, consolidate, compare, detect-source, status]
