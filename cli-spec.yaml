      - names: ["--last-page"]
        value_name: last-page
        required: false
        help: "結束頁碼。"
  - path: "macdoc pdf ocr"
    abstract: "整頁 GLM-OCR（簡化 pipeline，取代 blocks + transcribe）。"
    options:
      - names: ["--project"]
        value_name: project
        required: false
        help: "專案資料夾。"
      - names: ["--pdf"]
        value_name: pdf
        required: false
        help: "來源 PDF。"
      - names: ["--output"]
        value_name: output
        required: false
        help: "輸出資料夾。"
      - names: ["--mode"]
        value_name: mode
        required: false
        default: local
        help: "執行模式 (local|ollama)。"
      - names: ["--host"]
        value_name: host
        required: false
        help: "Ollama host；可以是 config ocr 的 profile 名稱，或原始位址（沒給時看 config ocr，最後 fallback localhost:11434）。"
      - names: ["--first-page"]
        value_name: first-page
        required: false
        help: "起始頁碼。"
      - names: ["--last-page"]
        value_name: last-page
        required: false
        help: "結束頁碼。"
      - names: ["--page-dpi"]
        value_name: page-dpi
        required: false
        default: "200.0"
        help: "頁面渲染 DPI。"
      - names: ["--model"]
        value_name: model
        required: false
        help: "模型名稱：--mode local 是 HuggingFace repo（沒給時用 EZCon/GLM-OCR-8bit-mlx），--mode ollama 是 Ollama model tag（沒給時看 config ocr 的 default model）。"
      - names: ["--config"]
        value_name: config
        required: false
        help: "設定檔路徑（預設 ~/.config/macdoc/config.json）"
    flags:
      - names: ["--with-pdfkit"]
        required: false
        help: "強制啟用 PDFKit 交叉比對（向量 PDF 自動啟用）。"
    project:
      status: active
      dependencies: [huggingface, ollama]
      notes:
        - "Whole-page GLM-OCR for the PDF → LaTeX project pipeline; results are written into the project folder, not printed as Markdown."
        - "--mode local runs MLX and downloads the --model repository from Hugging Face on first use; it needs mlx.metallib beside the binary (make release)."
        - "--mode ollama sends page images to the Ollama server at --host."
        - "#218: --host and --model have no static default. Under --mode ollama, omitting either falls back first to the matching `macdoc config ocr` setting and then to a built-in fallback — --host also resolves a `config ocr add-host` profile name to its address. Under --mode local, `config ocr` is never consulted at all: --model falls straight back to a built-in HuggingFace repo id when omitted, and --host is unused. --mode is unaffected by any of this: its own declared default still applies when omitted, and `config ocr set-backend`'s setting is never read — using Ollama still requires passing --mode ollama yourself (see that command's own abstract for why)."
        - "--config points at an alternate settings file instead of ~/.config/macdoc/config.json, same flag as `macdoc config ocr`."
